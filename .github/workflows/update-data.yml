# Pulls new scores, schedules and tournament results from MHSAA and commits any
# changes, which makes Streamlit Cloud redeploy the app with fresh data.
name: Update game data

on:
  schedule:
    # Four times a day (UTC) from November through April
    - cron: "0 5,11,17,23 * 11,12,1-4 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Fetch games from the MHSAA Score Center
        run: python fetch_games.py

      # The tournament feed is empty until the brackets are drawn in late February.
      # A tournament problem shouldn't block the score update, so this step can't fail the run.
      - name: Refresh tournament results
        continue-on-error: true
        run: python refresh_tournament.py

      - name: Commit changes
        run: |
          if git status --porcelain -- 'games_*.csv' 'tournament_*.csv' | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add games_*.csv tournament_*.csv
            git commit -m "Update game data from MHSAA ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes"
          fi
